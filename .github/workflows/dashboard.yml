name: Dashboard stats

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Collect stats
        env:
          YANDEX_METRIKA_TOKEN: ${{ secrets.YANDEX_METRIKA_TOKEN }}
          YANDEX_WEBMASTER_TOKEN: ${{ secrets.YANDEX_WEBMASTER_TOKEN }}
          LEAD_STATS_URL: ${{ secrets.LEAD_STATS_URL }}
          LEAD_API_SECRET: ${{ secrets.LEAD_API_SECRET }}
        run: node dashboard/collect.mjs
      - name: Commit dashboard/data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/data.json
          if git diff --staged --quiet; then
            echo "No data.json changes"
          else
            git commit -m "chore: update dashboard stats"
            git push
          fi
