name: SEO health-check

on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.html'
      - 'seo/**'
      - 'sitemap.xml'
      - 'robots.txt'

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate sitemap
        run: node seo/generate-sitemap.mjs
      - name: Fail if sitemap drifted
        run: |
          if ! git diff --quiet -- sitemap.xml; then
            echo "sitemap.xml is out of date. Run: node seo/generate-sitemap.mjs"
            git diff -- sitemap.xml
            exit 1
          fi
      - name: Local health-check
        run: node seo/health-check.mjs

# Live-проверка и запись dashboard/health.json — в dashboard.yml (два раза в сутки + ручной запуск).
# Здесь только CI на пуше HTML/SEO, без коммита, чтобы не гоняться с дашбордом за один JSON.
