<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="REMPHONE">
  <!-- Dark navy rounded square -->
  <rect width="120" height="120" rx="22" ry="22" fill="#0B1F3A"/>
  <!-- Phone outline -->
  <rect x="34" y="18" width="52" height="84" rx="8" ry="8" fill="none" stroke="#FFFFFF" stroke-width="5"/>
  <!-- Speaker / home slots -->
  <rect x="50" y="26" width="20" height="3.5" rx="1.5" fill="#FFFFFF"/>
  <rect x="50" y="90.5" width="20" height="3.5" rx="1.5" fill="#FFFFFF"/>
  <!-- Gear -->
  <g fill="#FFFFFF" transform="translate(60 58)">
    <circle r="9" fill="#FFFFFF"/>
    <circle r="4.2" fill="#0B1F3A"/>
    <rect x="-2.2" y="-16" width="4.4" height="6" rx="1"/>
    <rect x="-2.2" y="10" width="4.4" height="6" rx="1"/>
    <rect x="-16" y="-2.2" width="6" height="4.4" rx="1"/>
    <rect x="10" y="-2.2" width="6" height="4.4" rx="1"/>
    <rect x="-2.2" y="-16" width="4.4" height="6" rx="1" transform="rotate(45)"/>
    <rect x="-2.2" y="-16" width="4.4" height="6" rx="1" transform="rotate(-45)"/>
    <rect x="-2.2" y="-16" width="4.4" height="6" rx="1" transform="rotate(135)"/>
    <rect x="-2.2" y="-16" width="4.4" height="6" rx="1" transform="rotate(-135)"/>
  </g>
  <!-- Wrench diagonal -->
  <g fill="#FFFFFF" transform="translate(60 58) rotate(-45)">
    <rect x="-2.5" y="-2" width="5" height="22" rx="2"/>
    <path d="M-7.5,-14 C-7.5,-20 -2.5,-22 0,-22 C2.5,-22 7.5,-20 7.5,-14 L3.2,-14 C3.2,-16.2 1.6,-17.2 0,-17.2 C-1.6,-17.2 -3.2,-16.2 -3.2,-14 Z"/>
  </g>
</svg>
